# Optional: run the backend against PostgreSQL instead of the local H2 file.
#   docker compose up -d
#   cd backend && ./mvnw spring-boot:run -Dspring-boot.run.profiles=postgres
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: specbuilder
      POSTGRES_USER: specbuilder
      POSTGRES_PASSWORD: specbuilder
    ports:
      - "5432:5432"
    volumes:
      - specbuilder-pg:/var/lib/postgresql/data

volumes:
  specbuilder-pg:
